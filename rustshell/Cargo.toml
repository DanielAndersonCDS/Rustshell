[workspace]
resolver = "2"
members = ["crates/desktop", "crates/taskbar", "crates/filemanager"]

[workspace.dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = "0.4"
dirs = "5"
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Dwm",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
